name: Publish Daily Magazine
on:
  push:
    paths:
      - 'editions/*.html'
      - 'scripts/update_editions.py'
  schedule:
    - cron: '35 8 * * *'
  workflow_dispatch:
    inputs:
      edition_url:
        description: 'HTTPS URL to a complete magazine HTML (optional; otherwise use configured source URL template)'
        required: false
        type: string
      edition_date:
        description: 'Issue date YYYY-MM-DD; defaults to today UTC'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: daily-magazine-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch optional daily edition and regenerate feed
        env:
          SOURCE_TEMPLATE: ${{ vars.MAGAZINE_SOURCE_URL_TEMPLATE }}
          INPUT_URL: ${{ inputs.edition_url }}
          INPUT_DATE: ${{ inputs.edition_date }}
        run: python scripts/update_editions.py
      - name: Publish changed files
        run: |
          if [[ -n "$(git status --porcelain -- editions editions.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add editions editions.json
            git commit -m 'Publish magazine edition index'
            git push
          fi
