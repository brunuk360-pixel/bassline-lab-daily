services:
  - type: web
    name: sublevel-unsigned
    runtime: python
    region: frankfurt
    plan: free
    rootDir: sublevel/unsigned
    buildCommand: pip install -r requirements.txt && python -m unittest -v test_community.py
    startCommand: python app.py && gunicorn --workers 1 --threads 2 --timeout 30 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_CODE
        generateValue: true
      - key: ADMIN_CODE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sublevel-unsigned-db
          property: connectionString
databases:
  - name: sublevel-unsigned-db
    region: frankfurt
    plan: free
    ipAllowList: []
